baseURL = "https://huluk.github.io/"
locale = "en"
title = "Huluks Blog"

[params]
description = "Where I might post things…"
author = "Lars Hansen"
background_color_class = "bg-dark-green"

[params.ananke]
custom_css = ["custom.css"]

[params.ananke.social.follow]
networks = ["github", "twitter"]

[params.ananke.social.github]
username = "Huluk"

[params.ananke.social.twitter]
username = "LarsHuluk"

[taxonomies]
category = "categories"
tag = "tags"

[outputFormats.rss]
baseName = "feed"

[[menus.main]]
name = "About"
pageRef = "/about"
weight = 10

[[menus.main]]
name = "Contact"
pageRef = "/contact"
weight = 20

[module]
[[module.imports]]
path = 'github.com/gohugo-ananke/ananke/v2'
